[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestrador-cli-local"
version = "0.1.0"
description = "Orquestração local de agentes CLI em modo single"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
api = ["agno>=3.2,<4", "anthropic", "google-genai", "openai", "pydantic>=2", "sqlalchemy[asyncio]", "mcp>=2.3,<3"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
